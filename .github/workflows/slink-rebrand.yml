name: Slink documentation migration
on:
  push:
    branches: [rebrand/slink-phase2]
permissions:
  contents: write
jobs:
  docs:
    if: "!contains(github.event.head_commit.message, '[slink-docs]')"
    runs-on: ubuntu-latest
    steps:
      - name: Replace legacy product name in all Markdown docs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: rebrand/slink-phase2
        shell: python
        run: |
          import base64
          import json
          import os
          import re
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'slink-doc-migration',
          }

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          listing = request(f'https://api.github.com/repos/{repo}/contents/doc?ref={branch}')
          docs = sorted(item['path'] for item in listing if item['type'] == 'file' and item['name'].endswith('.md'))

          # Keep genuine upstream references intact; they are historical/source links,
          # not the Slink product identity. Product commands and prose are migrated.
          upstream_pattern = re.compile(r'https://github\\.com/Genymobile/scrcpy(?:/[^\\s)\\]>]*)?')
          external_pattern = re.compile(r'https://github\\.com/pierlon/scrcpy-docker(?:/[^\\s)\\]>]*)?')

          changed = []
          for path in docs:
              item = request(f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}')
              old = base64.b64decode(item['content']).decode('utf-8')

              protected = []
              def protect(match):
                  token_name = f'__SLINK_PROTECTED_{len(protected)}__'
                  protected.append((token_name, match.group(0)))
                  return token_name

              text = upstream_pattern.sub(protect, old)
              text = external_pattern.sub(protect, text)

              # Build instructions should clone Slink itself, not the upstream repository.
              text = text.replace('git clone https://github.com/Genymobile/scrcpy', 'git clone https://github.com/slickyincorp/slink')
              text = text.replace('cd scrcpy', 'cd slink')

              text = re.sub(r'(?i)scrcpy', 'slink', text)

              for token_name, value in protected:
                  text = text.replace(token_name, value)

              if text != old:
                  payload = {
                      'message': f'docs: complete Slink rebrand in {path} [slink-docs]',
                      'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
                      'sha': item['sha'],
                      'branch': branch,
                  }
                  request(f'https://api.github.com/repos/{repo}/contents/{path}', 'PUT', payload)
                  changed.append(path)

          print(f'Updated {len(changed)} Markdown documentation files.')
          for path in changed:
              print(path)

          # Final documentation-only audit. Upstream source URLs are intentionally exempt.
          remaining = []
          for path in docs:
              item = request(f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}')
              text = base64.b64decode(item['content']).decode('utf-8')
              text = upstream_pattern.sub('', text)
              text = external_pattern.sub('', text)
              if re.search(r'(?i)scrcpy', text):
                  remaining.append(path)

          if remaining:
              raise SystemExit('Legacy product identity remains in: ' + ', '.join(remaining))
          print('Slink documentation audit passed.')
